<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fanatico Bochum</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- =========================================
         OBERER BEREICH
    ========================================== -->

    <header class="top-header">

        <div class="top-header-inner">

            <div class="brand">

                <img
                    src="logo2_2.png"
                    alt="Fanatico Bochum Logo"
                    class="logo"
                >

                <div class="brand-text">
                    <span>FANSEITE</span>
                    <h1>FANATICO <strong>BOCHUM</strong></h1>
                </div>

            </div>


            <div class="top-links">

                <a href="#bilder">Bilder</a>
                <a href="#aktuelles">Aktuelles</a>

            </div>

        </div>

    </header>



    <!-- =========================================
         BLAUE NAVIGATION
    ========================================== -->

    <nav class="main-nav">

        <div class="nav-inner">

            <div class="nav-space"></div>

            <div class="nav-links">

                <a href="#bilder" class="active">
                    BILDER
                </a>

                <a href="#aktuelles">
                    AKTUELLES
                </a>

            </div>

        </div>

    </nav>



    <!-- =========================================
         SEITENINHALT
    ========================================== -->

    <main class="page">


        <!-- =====================================
             BILDER
        ====================================== -->

        <section id="bilder" class="content-box">

            <h2>Bilder</h2>

            <div class="line"></div>


            <div class="subnav">

                <a href="#bilder">ALLE BILDER</a>

                <span>|</span>

                <a href="#bilder">SAISON 5</a>

                <span>|</span>

                <a href="#aktuelles">AKTUELLES</a>

            </div>


            <div class="bilder-content">

                <div class="empty">

                    <div class="empty-icon">
                        +
                    </div>

                    <h3>
                        SAISON 5
                    </h3>

                    <p>
                        Bilder kommen bald.
                    </p>

                </div>

            </div>

        </section>



        <!-- =====================================
             AKTUELLES
        ====================================== -->

        <section id="aktuelles" class="content-box aktuelles">

            <h2>Aktuelles</h2>

            <div class="line"></div>


            <div class="news">

                <div class="news-date">
                    2026
                </div>


                <div class="news-text">

                    <span>
                        FANATICO BOCHUM
                    </span>

                    <h3>
                        Saison 5
                    </h3>

                    <p>
                        Alle Neuigkeiten rund um Fanatico Bochum.
                    </p>

                </div>


                <div class="news-image">

                    <img
                        src="logo2_2.png"
                        alt="Fanatico Bochum"
                    >

                </div>

            </div>

        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <div class="footer-inner">

            <img
                src="logo2_2.png"
                alt="Fanatico Bochum"
            >

            <span>
                © 2026 Fanatico Bochum
            </span>

        </div>

    </footer>


</body>
</html>
