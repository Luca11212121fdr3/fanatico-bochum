<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fanatico Bochum</title>

    <!-- Schriftarten -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="header-inhalt">

            <img
                src="logo2_2.png"
                alt="Fanatico Bochum Logo"
                class="logo"
            >

            <div class="seiten-titel">

                <span>FANSEITE</span>

                <h1>
                    FANATICO <strong>BOCHUM</strong>
                </h1>

            </div>

        </div>

    </header>



    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <nav class="navigation">

        <div class="nav-inhalt">

            <a href="#bilder">
                Bilder
            </a>

            <a href="#aktuelles">
                Aktuelles
            </a>

        </div>

    </nav>



    <!-- =========================================
         HAUPTBEREICH
    ========================================== -->

    <main class="hauptbereich">


        <!-- =====================================
             BILDER
        ====================================== -->

        <section id="bilder" class="bereich">

            <div class="bereich-titel">

                <span>SAISON 05</span>

                <h2>
                    BILDER
                </h2>

            </div>


            <div class="bildergalerie">


                <!--
                Hier später deine Bilder einsetzen.

                Beispiel:

                <div class="bild">
                    <img src="bilder/bild1.jpg" alt="Fanatico Bochum">
                </div>

                -->


                <div class="keine-bilder">

                    <div class="plus">
                        +
                    </div>

                    <h3>
                        BILDER KOMMEN BALD
                    </h3>

                    <p>
                        Saison 5
                    </p>

                </div>


            </div>

        </section>



        <!-- =====================================
             AKTUELLES
        ====================================== -->

        <section id="aktuelles" class="bereich">

            <div class="bereich-titel">

                <span>NEWS</span>

                <h2>
                    AKTUELLES
                </h2>

            </div>


            <div class="aktuelles-box">

                <div class="punkt"></div>

                <div>

                    <span class="news-label">
                        FANATICO BOCHUM
                    </span>

                    <h3>
                        Saison 5
                    </h3>

                </div>

            </div>

        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <img
            src="logo2_2.png"
            alt="Fanatico Bochum"
        >

        <span>
            © 2026 Fanatico Bochum
        </span>

    </footer>


</body>

</html>
